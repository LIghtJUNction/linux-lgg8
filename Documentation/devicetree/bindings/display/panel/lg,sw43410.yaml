%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/lg,sw43410.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LG SW43410 1440x3120 AMOLED panel

maintainers:
  - LIghtJUNction <106986785+LIghtJUNction@users.noreply.github.com>

description: |
  Four-lane DSI command-mode panel used by the LG G8 ThinQ Alpha_lao.
  The panel uses DSC 1.1 SCR1 with two 720-pixel slices. This binding
  describes the experimental driver in the LG G8 kernel tree.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: lg,sw43410
  reg:
    maxItems: 1
  port: true
  vddi-supply: true
  vpnl-supply: true
  reset-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - vddi-supply
  - vpnl-supply
  - reset-gpios
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;
        panel@0 {
            compatible = "lg,sw43410";
            reg = <0>;
            vddi-supply = <&vreg_l14a_1p8>;
            vpnl-supply = <&vreg_l17a_3p0>;
            reset-gpios = <&tlmm 6 GPIO_ACTIVE_LOW>;
            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
