%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-fg-observer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B battery information observer

maintainers:
  - Casey Connolly <casey.connolly@linaro.org>

description: |
  Read-only observation of battery-info and memory-interface status registers,
  and experimental raw ADC_RR registers. The raw ADC_RR values do not establish
  a validated battery temperature. This node does not initialize the fuel gauge
  or control charging.

properties:
  compatible:
    const: qcom,pm8150b-fg-observer

  reg:
    minItems: 2
    items:
      - description: Battery-information peripheral base
      - description: Fuel-gauge memory-interface peripheral base
      - description: Fuel-gauge ADC_RR peripheral base for experimental raw reads

  status: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    spmi {
      #address-cells = <2>;
      #size-cells = <0>;

      pmic@2 {
        compatible = "qcom,pm8150b", "qcom,spmi-pmic";
        reg = <0x2 SPMI_USID>;
        #address-cells = <1>;
        #size-cells = <0>;

        battery-info@4100 {
          compatible = "qcom,pm8150b-fg-observer";
          reg = <0x4100>, <0x4300>, <0x4200>;
          status = "disabled";
        };
      };
    };
...
