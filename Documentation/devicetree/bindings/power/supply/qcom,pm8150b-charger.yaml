%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B SMB5 charger status

maintainers:
  - Casey Connolly <casey.connolly@linaro.org>

description:
  The PM8150B SMB5 charger function. A status driver can report USB presence,
  power-path selection and, when supplied, the MID_CHG ADC voltage. It does
  not configure the charger or control charging.

properties:
  compatible:
    const: qcom,pm8150b-charger

  reg:
    maxItems: 1

  io-channels:
    maxItems: 1
    description: |
      The single ADC5_MID_CHG_DIV6 channel of a qcom,spmi-adc5 provider at
      register base 0x3100 under the same PM8150B node as this charger. The
      provider must have exactly one available child with that channel's reg.
      Its qcom,pre-scaling must be <1 6>, or omitted to use ADC5's 1/6 default.
      ADC5 reports this processed voltage in microvolts; another IIO voltage
      provider cannot be substituted based on its channel name or type alone.
      The consumer driver validates the referenced topology before registering
      its power supply. These cross-node constraints are not schema-enforced.

  io-channel-names:
    items:
      - const: mid-chg

  status:
    enum:
      - disabled
      - okay

required:
  - compatible
  - reg

dependentRequired:
  io-channels: [io-channel-names]
  io-channel-names: [io-channels]

additionalProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    spmi {
      #address-cells = <2>;
      #size-cells = <0>;

      pmic@2 {
        compatible = "qcom,pm8150b", "qcom,spmi-pmic";
        reg = <0x2 SPMI_USID>;
        #address-cells = <1>;
        #size-cells = <0>;

        charger@1000 {
          compatible = "qcom,pm8150b-charger";
          reg = <0x1000>;
          status = "disabled";
        };
      };
    };
...
